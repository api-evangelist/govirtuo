aid: govirtuo
name: Virtuo
description: >-
  Virtuo (govirtuo.com) is a Paris-based, next-generation car rental company
  founded in 2015 and backed by Balderton Capital. It replaces the traditional
  rental counter with a mobile app: customers book, unlock, and return premium
  connected vehicles (Mercedes, BMW, Audi, Peugeot, Renault, Toyota, Volkswagen
  and others) entirely from their phone, with delivery options, free
  cancellation, and 24/7 support across 100+ locations in Europe. Virtuo also
  runs a "Virtuo for Business" corporate program and has committed to offsetting
  100% of trips and electrifying its fleet by 2030. Virtuo does not publish a
  public developer API or documentation surface; this profile captures the
  company's public web properties and domain-security posture for the API
  Evangelist network.
